services:
  team-api:
    container_name: fastapi-server
    image: ${BACKEND_IMAGE:-backend-team-api}
    env_file: .env
    environment:
      # 컨테이너 내부에서 localhost → 서비스명으로 오버라이드
      PG_LOCAL_URL: postgresql+asyncpg://spcteam4:${POSTGRES_PASSWORD}@team-db:5432/teamdb
      # Redis는 클라우드 URL 사용 (REDIS_CLOUD_URL은 .env에서 로드)
      REDIS_LOCAL_URL: ""
    ports:
      - 8000:8000
    depends_on:
      team-db:
        condition: service_healthy
    restart: unless-stopped

  team-nginx:
    container_name: nginx-server
    image: nginx:1.27-alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - team-api
    restart: unless-stopped

  team-db:
    container_name: postgres-server
    image: ${DB_IMAGE:-backend-team-db}
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      POSTGRES_DB: teamdb
      POSTGRES_USER: spcteam4
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spcteam4 -d teamdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
