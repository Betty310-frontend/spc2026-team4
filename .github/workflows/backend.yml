name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

defaults:
  run:
    working-directory: backend

jobs:
  # ──────────────────────────────────────────────
  # 1. CI: Lint · Type Check · Test (공통)
  # ──────────────────────────────────────────────
  ci:
    name: Lint · Type Check · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'
          enable-cache: true
          cache-dependency-glob: 'backend/uv.lock'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Test (pytest)
        run: uv run pytest --tb=short
        env:
          ENV: test

  # ──────────────────────────────────────────────
  # 2. Docker Hub 빌드 & 푸시 (push 이벤트만)
  # ──────────────────────────────────────────────
  build-push:
    name: Build & Push to Docker Hub
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          # main  → tidypr/spc-backend:latest
          # develop → tidypr/spc-backend:develop
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "value=${{ secrets.DOCKERHUB_USERNAME }}/spc-backend:latest" >> $GITHUB_OUTPUT
          else
            echo "value=${{ secrets.DOCKERHUB_USERNAME }}/spc-backend:develop" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=spc-backend-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=spc-backend-${{ github.ref_name }}

  # ──────────────────────────────────────────────
  # 3-A. 개발 서버 배포 (develop 브랜치)
  # ──────────────────────────────────────────────
  deploy-dev:
    name: Deploy → Dev Server (develop)
    needs: build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env (dev)
        run: |
          echo "${{ secrets.BACKEND_ENV_DEV }}" \
            | sed -e 's/[[:space:]]*=[[:space:]]*/=/g' \
                  -e "s/='\(.*\)'$/=\1/" \
                  -e 's/="\(.*\)"$/=\1/' \
            > ${{ github.workspace }}/.env.clean

      - name: SCP .env to dev server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY_DEV }}
          source: ".env.clean"
          target: /developers/app/backend/
          strip_components: 0

      - name: SCP nginx.conf to dev server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY_DEV }}
          source: backend/nginx.dev.conf
          target: /developers/app/backend/
          strip_components: 1

      - name: Deploy on dev server
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.build-push.outputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST_DEV }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY_DEV }}
          envs: IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            cd /developers/app/backend

            echo "DEBUG IMAGE=[${IMAGE}]"

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            docker pull "$IMAGE"

            docker network create backend_default 2>/dev/null || true

            docker stop fastapi-server 2>/dev/null || true
            docker rm   fastapi-server 2>/dev/null || true
            docker run -d \
              --name fastapi-server \
              --network backend_default \
              --env-file .env.clean \
              -p 8000:8000 \
              --restart unless-stopped \
              "$IMAGE"

            docker stop nginx-server 2>/dev/null || true
            docker rm   nginx-server 2>/dev/null || true
            docker ps -q --filter "publish=80" | xargs -r docker stop
            docker ps -aq --filter "publish=80" | xargs -r docker rm
            sudo fuser -k 80/tcp 2>/dev/null || true
            docker run -d \
              --name nginx-server \
              --network backend_default \
              -p 80:80 \
              -v /developers/app/backend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro \
              --restart unless-stopped \
              nginx:1.27-alpine

            docker image prune -f
            echo "✅ Dev 배포 완료: $IMAGE"

  # ──────────────────────────────────────────────
  # 3-B. 운영 서버 배포 (main 브랜치)
  # ──────────────────────────────────────────────
  deploy-prod:
    name: Deploy → Prod Server (main)
    needs: build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env (prod)
        run: |
          echo "${{ secrets.BACKEND_ENV_PROD }}" \
            | sed -e 's/[[:space:]]*=[[:space:]]*/=/g' \
                  -e "s/='\(.*\)'$/=\1/" \
                  -e 's/="\(.*\)"$/=\1/' \
            > ${{ github.workspace }}/.env.clean

      - name: SCP .env to prod server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY_PROD }}
          source: ".env.clean"
          target: ~/app/backend/
          strip_components: 0

      - name: SCP nginx.conf to prod server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY_PROD }}
          source: backend/nginx.conf
          target: ~/app/backend/
          strip_components: 1

      - name: Deploy on prod server
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.build-push.outputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY_PROD }}
          envs: IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            cd ~/app/backend

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            docker pull "$IMAGE"

            docker network create backend_default 2>/dev/null || true

            docker stop fastapi-server 2>/dev/null || true
            docker rm   fastapi-server 2>/dev/null || true
            docker run -d \
              --name fastapi-server \
              --network backend_default \
              --env-file .env.clean \
              -p 8000:8000 \
              --restart unless-stopped \
              "$IMAGE"

            docker stop nginx-server 2>/dev/null || true
            docker rm   nginx-server 2>/dev/null || true
            docker ps -q --filter "publish=80" | xargs -r docker stop
            docker ps -aq --filter "publish=80" | xargs -r docker rm
            sudo fuser -k 80/tcp 2>/dev/null || true
            docker run -d \
              --name nginx-server \
              --network backend_default \
              -p 80:80 -p 443:443 \
              -v ~/app/backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              --restart unless-stopped \
              nginx:1.27-alpine

            docker image prune -f
            echo "✅ Prod 배포 완료: $IMAGE"
